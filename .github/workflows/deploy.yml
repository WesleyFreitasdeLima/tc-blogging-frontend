name: Build, Lint

on:
  push:
    branches:
      - feature/ci-cd-frontend

  # Allows manual execution from the GitHub Actions UI
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Compile TypeScript and Build Vite
        run: npm run build
